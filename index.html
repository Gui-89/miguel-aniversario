<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐾 Miguel faz 4 Anos!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="confetti-canvas"></canvas>
  <div class="paws-bg" aria-hidden="true"></div>

  <!-- SEÇÃO 1: NEYMAR -->
  <section class="neymar-hero">
    <div class="neymar-wrap">
      <img src="assets/neymar_meme.png" alt="Confirmações encerradas!" class="neymar-img" />
    </div>
    <p class="neymar-caption">Ihhh… confirmações para o aniversário do Miguel encerradas! 😱🔒</p>
  </section>

  <!-- SEÇÃO 2: ENCARTE DA FESTA -->
  <header class="hero">
    <div class="hero-badge">🐾 MIGUEL FAZ 4 ANOS! 🐾</div>
    <img src="assets/banner.png" class="hero-banner" alt="Banner Patrulha Canina"/>
    <div class="hero-tagline"><span>A está bem próxima!</span></div>
  </header>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-paws">🐾🐾🐾</div>
    <p>Festa do Miguel 🎈 com muito amor</p>
    <p class="footer-small">® Todos os direitos reservados 2026 • Pai do Miguel rsrsrs</p>
  </footer>

  <!-- CAMPOS OCULTOS — lógica JS preservada -->
  <div style="display:none" aria-hidden="true">
    <input id="nome" />
    <input id="adultos" value="0" />
    <input id="criancas" value="0" />
    <input id="whatsapp" />
    <div id="form-error"></div>
    <div id="success-screen"></div>
    <span id="s-date"></span>
    <span id="s-time"></span>
    <span id="s-place"></span>
    <a id="maps-link" href="#"></a>
    <a id="maps-link-success" href="#"></a>
    <button id="confirm-btn"><span class="btn-text"></span><span class="btn-loader hidden" id="btn-loader"></span></button>
    <div id="form-wrapper"></div>
    <div id="countdown"></div>
    <span id="cd-days"></span><span id="cd-hours"></span>
    <span id="cd-mins"></span><span id="cd-secs"></span>
    <div id="event-passed-msg"></div>
    <span id="event-date-display"></span>
    <span id="event-time-display"></span>
    <span id="event-place-display"></span>
  </div>

  <!-- FIREBASE SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <audio id="bg-audio" src="assets/Miguel_Chegou.mp3" preload="auto" loop></audio>
  <button id="audio-btn" aria-label="Controlar música" title="Música">🔊</button>

  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
